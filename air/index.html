 if(type==='ล้างแอร์')return us.map(u=>u.btu<=13000?{n:`ล้างแอร์ ${u.room} (${K(u.btu)})`,p:500,c:60}:{n:`ล้างแอร์ ${u.room} (${K(u.btu)})`,p:700,c:80});

 return [{n:'ค่าตรวจเช็กอาการ',p:300,c:0}];
}
function mk(o){
 const j=Object.assign({status:'นัดแล้ว',paid:null,extra:null,photos:{before:0,after:0},units:[]},o);
 j.items=o.items||itemsFor(j.type,j.units.map(unit).filter(Boolean));
 j.checks=o.checks||CHECK[j.type].map(()=>0);
 j.log=(o.log||['book']).map(t=>typeof t==='string'?{t,at:''}:t);
 S.jobs.push(j);return j;
}

  {id:'u5',room:'ห้องนอน',brand:'Samsung',btu:9000,last:day(-165)}]},
 {id:'c4',name:'คลินิกทันตกรรมยิ้มสวย',phone:'0873334444',addr:'88 ถ.ศรีสุริยวงศ์',units:[

 {id:'c6',name:'หอพักบ้านสุขใจ',phone:'0947778888',addr:'150 ถ.เลี่ยงเมือง',units:[

 {id:'c7',name:'คุณประยูร มั่นคง',phone:'0981234567',addr:'210 ม.2 บ้านโนนสูง',units:[
  {id:'u12',room:'ห้องนอน',brand:'Sharp',btu:12000,last:day(-60)}]}
 ],jobs:[]};
 mk({id:'j1',cust:'c5',date:day(0),time:'09:00',type:'ล้างแอร์',units:['u9'],status:'เสร็จ',paid:'โอน',log:['book','go','start','done'],checks:[1,1,1,1,1],photos:{before:1,after:1}});

 const inc=done.reduce((a,j)=>a+sum(j.items,'p'),0);
 const up=S.jobs.filter(j=>j.date>day(0)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

 h+=`</div>`;

 h+=`<div class="sec">รายการค่าบริการ</div><div class="card">`+j.items.map(i=>`<div class="it"><span>${esc(i.n)}</span><span>${baht(i.p)}</span></div>`).join('')+`<div class="tot"><span>รวม</span><span>${baht(sum(j.items,'p'))}</span></div></div>`;

function qr(){let s='',r=7;for(let y=0;y<25;y++)for(let x=0;x<25;x++){r=(r*9301+49297)%233280;const f=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);const on=f?((x%6===0||y%6===0||(x%24===0)||(y%24===0)||(x>1&&x<5&&((y>1&&y<5)||(y>19&&y<23)))||(x>19&&x<23&&y>1&&y<5))):r/233280>.5;if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg viewBox="-1 -1 27 27" width="150" height="150" style="background:#fff">${s}</svg>`}
function sBill(j){

 j.items.map(i=>`<div class="it"><span>${esc(i.n)}</span><span>${baht(i.p)}</span></div>`).join('')+`</div><div class="tot"><span>ยอดชำระ</span><span>${baht(tot)}</span></div>

 else h+=`<div class="card" style="text-align:center"><div style="font-weight:600;margin-bottom:6px">ให้ลูกค้าสแกนจ่าย</div>${qr()}<div class="small mute">QR พร้อมเพย์ (ตัวอย่าง ใช้จ่ายจริงไม่ได้)</div></div>

function saveJob(){
 const f=S.form;let cid=f.cust,uids=f.units.slice();
 if(!cid){
  if(!f.newName.trim())return toast('ใส่ชื่อลูกค้าก่อนครับ');
  if(!f.newUnits.length)return toast('เพิ่มเครื่องแอร์อย่างน้อย 1 เครื่อง');
  cid='c'+(++S.seq);const units=f.newUnits.map(u=>Object.assign({id:'u'+(++S.seq),last:null},u));
  S.cust.push({id:cid,name:f.newName.trim(),phone:f.phone,addr:f.newAddr.trim()||'-',units});uids=units.map(u=>u.id);
 }
 if(!uids.length)return toast('เลือกเครื่องที่จะทำก่อนครับ');
 if(!f.time)return toast('เลือกเวลานัดก่อนครับ');
 const j=mk({id:'j'+(++S.seq),cust:cid,date:f.date,time:f.time,type:f.type,units:uids,log:[{t:'book',at:nowT()}]});
 S.lineJob=j.id;S.form=null;S.tab='today';render();scrollTo(0,0);
 toast('บันทึกนัดแล้ว · ส่งข้อความยืนยันเข้า LINE ลูกค้าแล้ว (ดูที่แท็บ ลูกค้า LINE)');
}

/* ---------- ลูกค้า LINE ---------- */
function vLine(){
 const opts=S.jobs.filter(j=>j.cust&&j.date>=day(0)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(!opts.length)return '<div class="card mute">ยังไม่มีนัด</div>';
 let j=job(S.lineJob);if(!j||!opts.includes(j))j=opts.find(o=>o.status!=='เสร็จ'&&o.status!=='นัดแล้ว')||opts[0];
 const c=cust(j.cust),us=j.units.map(unit),tot=sum(j.items,'p');
 let h=`<div class="card" style="padding:10px 14px"><label class="small mute">ดูมุมมองของลูกค้าคนไหน</label><select onchange="S.lineJob=this.value;render()">`+
  opts.map(o=>`<option value="${o.id}" ${o===j?'selected':''}>${o.date===day(0)?'วันนี้':thd(o.date)} ${o.time} · ${esc(cust(o.cust).name)} (${o.status})</option>`).join('')+`</select></div>`;
 h+=`<div class="lwrap"><div class="lhead"><div class="lav">❄️</div><div><b>แอร์เย็นใจ เซอร์วิส</b><div class="small" style="opacity:.9">บัญชีทางการ · คุยกับ ${esc(c.name)}</div></div></div><div class="lbody">`;
 j.log.forEach(e=>{
  if(e.t==='book')h+=`<div class="lcard"><div class="lc-h" style="background:#1E3A8A">✅ ยืนยันนัดหมาย</div><div class="lc-b">
   <div>📅 ${thd(j.date)} เวลา ${j.time} น.</div><div>${TICON[j.type]} ${j.type}</div><div>❄️ ${us.map(u=>esc(u.room)+' '+K(u.btu)).join(', ')}</div>
   <div class="small mute">📍 ${esc(c.addr)}</div><div class="tot"><span>ราคาประมาณ</span><span>${baht(sum(itemsFor(j.type,us),'p'))}</span></div>
   <div class="small mute">ช่างเอก · ถ้าต้องการเลื่อนนัด ตอบแชตนี้ได้เลย</div></div></div>`;
  if(e.t==='go')h+=`<div class="bub">🚐 ช่างเอกกำลังเดินทางไปหาคุณ<br>ถึงประมาณ 20–30 นาทีครับ</div>`;
  if(e.t==='start')h+=`<div class="bub">🔧 ช่างถึงแล้ว เริ่มงานครับ${j.photos.before?'<div class="pimg">📷 รูปก่อนทำ<br>(แผ่นกรอง/คอยล์ก่อนล้าง)</div>':''}</div>`;
  if(e.t==='extra'){
   h+=`<div class="lcard" style="border:2px solid #F97316"><div class="lc-h" style="background:#F97316">⚠️ ช่างพบปัญหาเพิ่ม</div><div class="lc-b"><div class="pimg">📷 รูปจุดที่พบปัญหา</div>
    <div>${esc(e.x.why)}</div><div class="tot"><span>${esc(e.x.n)}</span><span>${baht(e.x.p)}</span></div>`;
   if(e.r==null)h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn g" onclick="answer('${j.id}',0)">ไม่ทำ</button><button class="btn l" onclick="answer('${j.id}',1)">อนุมัติ</button></div>`;
   h+=`</div></div>`;
   if(e.r!=null)h+=`<div class="bub me">${e.r?'อนุมัติครับ ทำได้เลย 👍':'ยังไม่ทำรายการนี้ครับ'}</div>`;
  }
  if(e.t==='done')h+=`${j.photos.after?'<div class="bub">✨ งานเสร็จแล้วครับ<div class="pimg">📷 รูปหลังทำ<br>(สะอาด เย็นฉ่ำ)</div></div>':''}<div class="lcard"><div class="lc-h" style="background:#16A34A">🧾 ใบเสร็จ · ชำระแล้ว</div><div class="lc-b">`+
   j.items.map(i=>`<div class="it"><span>${esc(i.n)}</span><span>${baht(i.p)}</span></div>`).join('')+`<div class="tot"><span>รวม</span><span>${baht(tot)}</span></div>
   <div class="small" style="margin-top:6px">🛡️ รับประกันงาน 30 วัน<br>🔔 เราจะเตือนล้างแอร์ครั้งถัดไป ${thd(addMonths(j.date,6))}</div></div></div>`;
 });
 const pending=j.log.some(e=>e.t==='extra'&&e.r==null);
 h+=`</div></div>`;
 h+=`<div class="hint" style="margin:0 16px">${pending?'👆 ลองกด <b>อนุมัติ</b> แล้วกลับไปดูใบงานช่าง ราคาจะอัปเดตทันที':j.status==='เสร็จ'?'ลูกค้าได้ใบเสร็จและวันเตือนล้างรอบหน้าครบในแชตเดียว':'ข้อความในหน้านี้จะเพิ่มขึ้นเองทุกครั้งที่ช่างกดปุ่มในหน้า งานวันนี้'}</div>`;
 h+=cta();
 return h;
}
function answer(id,yes){
 const j=job(id),e=[...j.log].reverse().find(e=>e.t==='extra'&&e.r==null);if(!e)return;
 e.r=yes?1:0;if(yes)j.items.push({n:e.x.n,p:e.x.p,c:e.x.c});j.extra=null;j.status='กำลังทำ';render();
 toast(yes?'ลูกค้าอนุมัติแล้ว · ใบงานช่างอัปเดตราคาให้ทันที':'ลูกค้าไม่ทำรายการนี้ · แจ้งช่างแล้ว');
}
function cta(){return `<div class="cta"><p><b>อยากใช้ระบบนี้กับร้านแอร์ของคุณ?</b><br><span class="small">ทดลองใช้ฟรี 30 วัน</span></p><a class="btn l block" href="${LINE_OA}" target="_blank" rel="noopener">💬 สนใจใช้ระบบนี้ ทัก LINE</a></div><div class="foot">ระบบโดย <b style="color:var(--navy)">เพื่อนช่างแอร์</b> · ในเครือ <b style="color:var(--navy)">JOE ระบบงานง่ายๆ</b></div>`}

/* ---------- เตือนล้าง ---------- */
function vRemind(){
 const rows=dueInfo(),due=rows.filter(r=>r.due.length),soon=rows.filter(r=>!r.due.length&&r.soon.length);
 const okN=rows.reduce((a,r)=>a+r.us.filter(u=>u.d<150).length,0);
 const dueU=due.reduce((a,r)=>a.concat(r.due),[]),pot=sum(itemsFor('ล้างแอร์',dueU),'p');
 const toSend=due.filter(r=>!S.reminded[r.c.id]&&!upcomingFor(r.c.id));
 let h=`<div class="cta" style="text-align:left;margin-top:12px"><div class="small" style="opacity:.9">ถึงรอบล้างแล้ว (ครบ 6 เดือน)</div><div style="font-size:24px;font-weight:700">${due.length} ราย · ${dueU.length} เครื่อง</div><div>รายได้ที่รออยู่ ≈ <b>${baht(pot)}</b></div>
 ${toSend.length?`<button class="btn o block" style="margin-top:10px" onclick="remindAll()">💬 ส่งเตือนทุกคนเข้า LINE (${toSend.length})</button>`:''}</div>`;
 const ex=due[0]||soon[0];
 if(ex)h+=`<div class="sec">ตัวอย่างข้อความที่ลูกค้าได้รับ</div><div class="lwrap"><div class="lbody" style="min-height:0"><div class="bub">สวัสดีครับ ${esc(ex.c.name)} 🙏<br>แอร์ ${ex.c.units.length} เครื่องของคุณใช้งานมาครบ 6 เดือนแล้ว ถึงเวลาล้างให้เย็นเร็ว ลมแรง และประหยัดไฟขึ้นครับ<br>ตอบแชตนี้เพื่อเลือกวันนัดได้เลย ❄️</div></div></div>`;
 const card=(r,lv)=>{const up=upcomingFor(r.c.id),list=lv==='due'?r.due:r.soon;
  return `<div class="card"><div class="row"><div class="nm" style="margin:0;font-size:17.5px">${esc(r.c.name)}</div><span class="chip" style="background:${lv==='due'?'#FEE2E2;color:#B91C1C':'#FEF9C3;color:#854D0E'}">${lv==='due'?'ถึงรอบแล้ว':'ใกล้ถึง'}</span></div>`+
  list.map(u=>`<div class="sub">❄️ ${esc(u.room)} ${K(u.btu)} · ล้างล่าสุด ${Math.floor(u.d/30)} เดือนก่อน</div>`).join('')+
  (up?`<div style="margin-top:10px;color:#166534;font-weight:600">📅 มีนัดแล้ว ${up.date===day(0)?'วันนี้':thd(up.date)} ${up.time}</div>`:
  `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">${S.reminded[r.c.id]?'<button class="btn g" disabled>✓ ส่งเตือนแล้ว</button>':`<button class="btn l" onclick="remind('${r.c.id}')">💬 ส่งเตือน</button>`}<button class="btn n" onclick="bookFrom('${r.c.id}')">📅 นัดเลย</button></div>`)+`</div>`};
 if(due.length)h+=`<div class="sec">🔴 ถึงรอบแล้ว</div>`+due.map(r=>card(r,'due')).join('');
 if(soon.length)h+=`<div class="sec">🟡 ใกล้ถึงรอบ (ภายใน 1 เดือน)</div>`+soon.map(r=>card(r,'soon')).join('');
 h+=`<div class="hint" style="margin:12px 16px">🟢 ยังไม่ถึงรอบอีก ${okN} เครื่อง · ระบบนับให้เองจากวันที่ปิดงานล้างแอร์ล่าสุด</div>`;
 return h;
}
function remind(cid){S.reminded[cid]=1;render();toast('ส่งข้อความเตือนล้างแอร์เข้า LINE '+cust(cid).name+' แล้ว')}
function remindAll(){const r=dueInfo().filter(r=>r.due.length&&!S.reminded[r.c.id]&&!upcomingFor(r.c.id));r.forEach(x=>S.reminded[x.c.id]=1);render();toast('ส่งเตือนเข้า LINE แล้ว '+r.length+' ราย')}
function bookFrom(cid){const c=cust(cid),f=newForm();f.phone=c.phone;f.cust=cid;f.units=c.units.map(u=>u.id);S.form=f;go('new')}

/* ---------- รายได้ ---------- */
function vMoney(){
 const n=+S.period;
 const js=S.jobs.filter(j=>j.status==='เสร็จ'&&daysAgo(j.date)>=0&&daysAgo(j.date)<(n||1)).sort((a,b)=>b.date.localeCompare(a.date));
 const rev=js.reduce((a,j)=>a+sum(j.items,'p'),0),parts=js.reduce((a,j)=>a+sum(j.items,'c'),0),trav=TRAVEL*js.length,prof=rev-parts-trav;
 const by=TYPES.map(t=>({t,v:js.filter(j=>j.type===t).reduce((a,j)=>a+sum(j.items,'p'),0),n:js.filter(j=>j.type===t).length})),mx=Math.max(1,...by.map(b=>b.v));
 let h=`<div class="card" style="padding:8px"><div class="pick" style="justify-content:center">`+[['0','วันนี้'],['7','7 วัน'],['30','30 วัน']].map(p=>`<button class="${S.period===p[0]?'on':''}" onclick="S.period='${p[0]}';render()">${p[1]}</button>`).join('')+`</div></div>`;
 h+=`<div class="cta" style="text-align:left;margin-top:0"><div class="small" style="opacity:.9">กำไรสุทธิ</div><div style="font-size:30px;font-weight:700">${baht(prof)}</div><div class="small">${js.length} งาน · กำไร ${rev?Math.round(prof/rev*100):0}% · เฉลี่ย ${baht(js.length?prof/js.length:0)}/งาน</div></div>`;
 h+=`<div class="card"><div class="it"><span>รายรับทั้งหมด</span><b>${baht(rev)}</b></div><div class="it"><span>หัก ค่าอะไหล่ / น้ำยา</span><span style="color:#B91C1C">−${baht(parts)}</span></div><div class="it"><span>หัก ค่าเดินทาง (฿${TRAVEL}/งาน)</span><span style="color:#B91C1C">−${baht(trav)}</span></div><div class="tot"><span>เหลือเข้ากระเป๋า</span><span>${baht(prof)}</span></div></div>`;
 h+=`<div class="sec">รายรับแยกตามประเภทงาน</div><div class="card">`+by.map(b=>`<div style="margin:6px 0"><div class="row small"><span>${TICON[b.t]} ${b.t} (${b.n})</span><b>${baht(b.v)}</b></div><div class="bar" style="width:${Math.max(2,b.v/mx*100)}%"></div></div>`).join('')+`</div>`;
 h+=`<div class="sec">งานที่ปิดแล้ว</div><div class="card">`+(js.map(j=>{const r=sum(j.items,'p'),p=r-sum(j.items,'c')-TRAVEL;return `<div class="urow row"><div><b>${esc(jobName(j))}</b><div class="small mute">${j.date===day(0)?'วันนี้':thd(j.date)} · ${TICON[j.type]} ${j.type}</div></div><div style="text-align:right">${baht(r)}<div class="small" style="color:#166534">กำไร ${baht(p)}</div></div></div>`}).join('')||'<div class="mute">ยังไม่มีงานที่ปิดในช่วงนี้</div>')+`</div>`;
 h+=cta();
 return h;
}

load();
const qt=new URLSearchParams(location.search).get('tab');if(qt&&TITLES[qt])S.tab=qt;
render();
</script>
</body>
