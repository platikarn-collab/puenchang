<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E2E8F0}
body{font-family:'Prompt',system-ui,sans-serif;color:#0F172A;-webkit-tap-highlight-color:transparent}
button,input,a{font-family:inherit}
button{cursor:pointer;transition:transform .08s}

input:focus,button:focus-visible,a:focus-visible{outline:3px solid #F97316;outline-offset:1px}
#app{max-width:440px;margin:0 auto;height:100dvh;position:relative;display:flex;flex-direction:column;background:#F8FAFC;overflow:hidden;box-shadow:0 0 30px rgba(15,23,42,.15)}

main{flex:1;overflow-y:auto;padding:16px 16px 104px}
.enter{animation:enter .28s ease-out}

.h1{margin:0;font-size:24px;font-weight:700;color:#1E3A8A}

.row{display:flex;align-items:center}
.chip{flex-shrink:0;height:44px;padding:0 14px;border-radius:22px;border:2px solid;font-size:16px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{width:30px;height:30px;border-radius:15px;background:#1E3A8A;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.step{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.inp{width:100%;height:54px;border-radius:14px;border:2px solid #CBD5E1;background:#fff;padding:0 14px;font-size:18px;color:#0F172A}
.big{min-height:62px;border-radius:16px;border:none;font-size:19px;font-weight:700;padding:8px 12px;line-height:1.25;width:100%}
nav{position:absolute;left:0;right:0;bottom:0;height:82px;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 2px calc(8px + env(safe-area-inset-bottom))}
nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;position:relative;padding:0}
.badge{position:absolute;top:0;right:10px;min-width:22px;height:22px;border-radius:11px;background:#DC2626;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#0F172A;color:#fff;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.35;box-shadow:0 6px 20px rgba(15,23,42,.3);animation:up .25s ease-out;z-index:5}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.plate{border:2px solid #0F172A;border-radius:8px;background:#fff;padding:4px 10px;text-align:center;flex-shrink:0;min-width:112px}
.demo{background:#FFF7ED;color:#7C2D12;font-size:13px;text-align:center;padding:6px 10px;flex-shrink:0}
.zig{height:12px;background:linear-gradient(135deg,#fff 6px,transparent 0) 0 0/12px 12px repeat-x,linear-gradient(-135deg,#fff 6px,transparent 0) 0 0/12px 12px repeat-x}
.stamp{position:absolute;right:14px;top:86px;border:4px solid #15803D;color:#15803D;border-radius:10px;padding:2px 12px;font-size:24px;font-weight:700;transform:rotate(-12deg);background:rgba(255,255,255,.85);animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}

.bar{height:12px;border-radius:6px;background:#E2E8F0;overflow:hidden}
.bar>div{height:100%;border-radius:6px;transition:width .6s}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.bubble{background:#fff;border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:15px;line-height:1.5;box-shadow:0 1px 3px rgba(15,23,42,.12)}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:fixed;left:0;top:0;width:100%}}

      '<div class="g3">' + tile(due.length, 'ถึงกำหนด', '#DC2626') + tile(sent, 'ส่งแล้ว', '#1E3A8A') + tile(booked, 'จองคิวแล้ว', '#15803D') + '</div>';
    if (waiting.length) h += '<button data-act="remAll" class="big" style="background:#F97316;color:#1C1917;display:flex;align-items:center;justify-content:center;gap:8px">' + I.chat('#1C1917', 22) + 'ส่ง LINE ทุกคนที่ถึงกำหนด (' + waiting.length + ')</button>';
    S.rems.slice().sort(function (a, b) { return a.days - b.days; }).forEach(function (r) {
      var pct = Math.max(4, Math.min(100, Math.round((180 - r.days) / 180 * 100)));
      var col = r.days < 0 ? '#DC2626' : r.days <= 15 ? '#F97316' : '#15803D';
      var lab = r.days < 0 ? 'เลยกำหนด ' + (-r.days) + ' วัน' : r.days <= 30 ? 'อีก ' + r.days + ' วัน' : 'อีก ' + Math.round(r.days / 30) + ' เดือน';
      h += '<article class="card" style="gap:10px"><div class="row" style="justify-content:space-between;gap:8px;align-items:flex-start"><div style="min-width:0"><div style="font-size:18px;font-weight:700">' + esc(r.cus) + '</div><div style="font-size:14px;color:#475569">' + esc(r.plate) + ' · ' + esc(r.car) + '</div></div>' +
        '<div style="flex-shrink:0;padding:3px 10px;border-radius:10px;background:' + col + ';color:' + (r.days <= 15 && r.days >= 0 ? '#1C1917' : '#fff') + ';font-size:14px;font-weight:700">' + lab + '</div></div>' +
        '<div class="bar"><div style="width:' + pct + '%;background:' + col + '"></div></div>' +
        '<div style="font-size:14px;color:#334155">ครั้งล่าสุด: ' + esc(r.last) + '</div>';
      if (r.booked) h += '<div style="background:#ECFDF5;border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600;color:#166534">📅 ลูกค้ากดจองคิวแล้ว: ' + esc(r.booked) + '</div>';
      else if (r.sent) h += '<div style="background:#EFF6FF;border-radius:12px;padding:10px 12px;font-size:16px;font-weight:600;color:#1E3A8A">✓ ส่ง LINE แล้ว · รอลูกค้าตอบ…</div>';
      else h += '<button data-act="rem" data-v="' + r.id + '" style="height:52px;border-radius:14px;border:2px solid #1E3A8A;background:' + (r.days <= 15 ? '#1E3A8A' : '#fff') + ';color:' + (r.days <= 15 ? '#fff' : '#1E3A8A') + ';font-size:17px;font-weight:600">ส่ง LINE ชวนกลับมาเช็กรถ</button>';
      h += '</article>';
    });
    var ex = S.rems.filter(function (r) { return r.days <= 15; })[0] || S.rems[0];
    h += '<div class="col" style="gap:8px;background:#E0E7FF;border-radius:18px;padding:14px"><div style="font-size:15px;font-weight:600;color:#1E3A8A">ตัวอย่างข้อความที่ลูกค้าได้รับใน LINE</div>' +
      '<div class="bubble">สวัสดีครับ ' + esc(ex.cus) + ' 🙏<br>รถ ' + esc(ex.car) + ' (' + esc(ex.plate) + ') ถึงรอบเช็กระยะแล้วครับ<br>เปลี่ยนน้ำมันเครื่องรอบนี้ รับส่วนลดค่าแรง 10% 🔧<br><b style="color:#1E3A8A">กดจองคิวด้านล่างได้เลยครับ</b><div style="margin-top:10px;background:#15803D;color:#fff;border-radius:10px;text-align:center;padding:8px;font-weight:700">จองคิว</div></div>' +
      '<div style="font-size:13px;color:#334155">— อู่ช่างเอก (ส่งอัตโนมัติจากเพื่อนช่าง)</div></div></div>';
    return h;
  }
  function tile(n, label, col) { return '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px;text-align:center"><div style="font-size:28px;font-weight:700;color:' + col + ';line-height:1.1">' + n + '</div><div style="font-size:13px;color:#475569">' + label + '</div></div>'; }

  function profit() {
    var pj = S.jobs.filter(function (j) { return j.status !== 'quote'; });
    function calc(j) {
      var rev = total(j) - disc(j), parts = 0, labor = 0;
      j.items.forEach(function (i) { if (i.type === 'part') parts += i.cost; else labor += i.cost; });
      return { rev: rev, parts: parts, labor: labor, net: rev - parts - labor };
    }
    function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
    var T = { rev: 0, parts: 0, labor: 0, net: 0 };
    pj.forEach(function (j) { var c = calc(j); for (var k in T) T[k] += c[k]; });
    var paidSum = pj.filter(function (j) { return j.paid; }).reduce(function (a, j) { return a + total(j) - disc(j); }, 0);
    var wk = WEEK.concat([['วันนี้', T.net]]), mx = Math.max.apply(null, wk.map(function (w) { return w[1]; })) || 1;
    var h = '<div class="col" style="gap:14px"><div class="row" style="justify-content:space-between;gap:8px"><h1 class="h1">กำไรวันนี้</h1><button class="chip" data-act="hide" style="border-color:#1E3A8A;background:#fff;color:#1E3A8A;font-size:15px">' + (S.hide ? 'แสดงยอด' : 'ซ่อนยอด') + '</button></div>' +
      '<div class="col" style="background:#1E3A8A;border-radius:18px;padding:16px;color:#fff;gap:10px"><div style="font-size:15px;color:#DBEAFE">กำไรสุทธิ ' + pj.length + ' คัน (เฉพาะเจ้าของอู่)</div>' +
      '<div class="row" style="align-items:baseline;gap:10px"><span style="font-size:38px;font-weight:700;line-height:1.1">฿' + money(T.net) + '</span><span style="font-size:18px;font-weight:700;background:#F97316;color:#1C1917;border-radius:10px;padding:2px 10px">' + pct(T.net, T.rev) + '%</span></div>' +
      '<div class="g3" style="font-size:13px;color:#DBEAFE"><div>รายรับ<div style="font-size:17px;font-weight:600;color:#fff">฿' + money(T.rev) + '</div></div><div>ต้นทุนอะไหล่<div style="font-size:17px;font-weight:600;color:#fff">฿' + money(T.parts) + '</div></div><div>ค่าแรงช่าง<div style="font-size:17px;font-weight:600;color:#fff">฿' + money(T.labor) + '</div></div></div>' +
      '<div style="font-size:14px;color:#DBEAFE;border-top:1px solid rgba(255,255,255,.2);padding-top:8px">เงินเข้าแล้ววันนี้ <b style="color:#fff">฿' + money(paidSum) + '</b> · รอเก็บเงิน <b style="color:#FDBA74">฿' + money(T.rev - paidSum) + '</b></div></div>' +
      '<div class="card" style="gap:8px"><div class="row" style="justify-content:space-between"><span style="font-size:16px;font-weight:600">กำไร 7 วัน</span><span style="font-size:12px;color:#475569">6 วันก่อนหน้าเป็นข้อมูลตัวอย่าง</span></div><div class="row" style="align-items:flex-end;gap:6px;height:120px">';
    wk.forEach(function (w, i) {
      var today = i === wk.length - 1;
      h += '<div class="col" style="flex:1;align-items:center;gap:4px;height:100%;justify-content:flex-end"><div style="font-size:11px;color:#475569">' + (S.hide ? '' : (w[1] / 1000).toFixed(1) + 'k') + '</div><div style="width:100%;border-radius:6px 6px 2px 2px;background:' + (today ? '#F97316' : '#93C5FD') + ';height:' + Math.max(4, w[1] / mx * 80) + 'px;transition:height .6s"></div><div style="font-size:12px;color:' + (today ? '#C2410C' : '#475569') + ';font-weight:' + (today ? 700 : 500) + '">' + w[0] + '</div></div>';
    });
    h += '</div></div>' +
      '<div class="row" style="gap:14px;font-size:14px;color:#334155;flex-wrap:wrap"><span class="row" style="gap:6px"><span style="width:14px;height:14px;border-radius:3px;background:#1E3A8A"></span>อะไหล่</span><span class="row" style="gap:6px"><span style="width:14px;height:14px;border-radius:3px;background:#93C5FD"></span>ค่าแรงช่าง</span><span class="row" style="gap:6px"><span style="width:14px;height:14px;border-radius:3px;background:#15803D"></span>กำไร</span></div>';
    pj.forEach(function (j) {
      var c = calc(j), s = ST[j.status];
      h += '<article class="card" style="gap:10px"><div class="row" style="justify-content:space-between;gap:8px"><div><div style="font-size:20px;font-weight:700">' + esc(j.plate) + '</div><div style="font-size:14px;color:#475569">' + esc(j.car) + '</div></div><div style="padding:3px 10px;border-radius:10px;background:' + s.bg + ';color:' + s.fg + ';font-size:14px;font-weight:600">' + s.label + (j.paid ? ' · ชำระแล้ว' : '') + '</div></div>' +
        '<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:#E2E8F0"><div style="width:' + (c.parts / c.rev * 100) + '%;background:#1E3A8A"></div><div style="width:' + (c.labor / c.rev * 100) + '%;background:#93C5FD"></div><div style="width:' + Math.max(0, c.net / c.rev * 100) + '%;background:#15803D"></div></div>' +
        '<div class="g2" style="gap:4px 12px;font-size:15px;color:#334155"><span>ราคาขาย</span><span style="text-align:right;font-weight:600;color:#0F172A">฿' + money(c.rev) + '</span><span>− ต้นทุนอะไหล่</span><span style="text-align:right">฿' + money(c.parts) + '</span><span>− ค่าแรงช่าง</span><span style="text-align:right">฿' + money(c.labor) + '</span></div>' +
        '<div class="row" style="justify-content:space-between;align-items:baseline;border-top:2px solid #F1F5F9;padding-top:8px"><span style="font-size:17px;font-weight:600">กำไรสุทธิ</span><span style="font-size:24px;font-weight:700;color:#15803D">฿' + money(c.net) + ' <span style="font-size:16px">(' + pct(c.net, c.rev) + '%)</span></span></div></article>';
    });
    return h + '<div style="font-size:14px;color:#475569;line-height:1.5">นับเฉพาะรถที่ลูกค้าอนุมัติแล้ว ลองไปกด "อนุมัติซ่อม" ในหน้าลูกค้า หรือออกบิลรับเงิน แล้วกลับมาดูตัวเลขเปลี่ยน</div><div style="text-align:center;font-size:13px;color:#475569;padding-top:6px">เพื่อนช่าง · ในเครือ <b style="color:#1E3A8A">JOE ระบบงานง่ายๆ</b></div></div>';
  }

  function navbar() {
    var pend = S.jobs.filter(function (j) { return j.status === 'quote'; }).length;
    var due = S.rems.filter(function (r) { return r.days <= 15 && !r.sent; }).length;
    var scr = S.screen === 'bill' ? 'dash' : S.screen;
    function c(k) { return scr === k ? '#1E3A8A' : '#64748B'; }
    return '<nav>' +
      '<button data-act="go" data-v="dash" style="color:' + c('dash') + '"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>หน้าอู่</button>' +
      '<button data-act="go" data-v="in" style="color:' + c('in') + '"><span style="width:44px;height:36px;border-radius:12px;background:#F97316;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>รับรถ</button>' +
      '<button data-act="go" data-v="line" style="color:' + c('line') + '">' + I.chat('currentColor', 27) + 'ลูกค้า LINE' + (pend ? '<span class="badge">' + pend + '</span>' : '') + '</button>' +
      '<button data-act="go" data-v="remind" style="color:' + c('remind') + '">' + I.bell('currentColor', 27) + 'เตือนเช็ก' + (due ? '<span class="badge">' + due + '</span>' : '') + '</button>' +
      '<button data-act="go" data-v="profit" style="color:' + c('profit') + '"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>กำไร</button></nav>';
  }

  var app = document.getElementById('app'), lastScreen = null;
  function render() {
    var a = document.activeElement, fid = a && a.id, pos = a && a.selectionStart;
    var main = app.querySelector('main'), top = main ? main.scrollTop : 0;
    var changed = lastScreen !== S.screen;
    var body = { dash: dash, 'in': checkin, line: line, profit: profit, bill: bill, remind: remind }[S.screen]();
    app.innerHTML = header() + '<main><div class="' + (changed ? 'enter' : '') + '">' + body + '</div></main>' + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '') + navbar();
    var m = app.querySelector('main');
    m.scrollTop = changed ? 0 : top;
    lastScreen = S.screen;
    if (fid && !changed) { var el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  }

  function submit() {
    var found = norm(S.plate) === 'กข1234';
    var picked = PRESETS.filter(function (p) { return S.sym[p[0]]; });
    var items = [];
    picked.forEach(function (p) { items = items.concat(it(p[1])); });
    if (!items.length) items = it([['ค่าตรวจเช็กเบื้องต้น', 'labor', 300, 100]]);
    var shots = SHOTS.filter(function (k) { return S.shots[k]; });
    shots.sort(function (a, b) { return (b === 'จุดที่เสีย') - (a === 'จุดที่เสีย'); });
    var pics = shots.map(function (k) { return { label: k, src: S.shots[k] }; });
    var d = new Date(), id = 'j' + S.n;
    var job = {
      id: id, plate: S.plate.trim(), prov: found ? 'สุรินทร์' : 'ทะเบียนใหม่', car: found ? 'Toyota Vios สีเทา' : 'รถลูกค้าใหม่',
      cus: found ? 'คุณสมชาย' : (S.cusName.trim() || 'ลูกค้าใหม่'),
      sym: picked.length ? picked.map(function (p) { return p[0]; }).join(', ') : 'ตรวจเช็กทั่วไป', status: 'quote',
      time: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2), km: S.km,
      pics: pics.length ? pics : [{ label: 'ยังไม่ได้ถ่ายรูป' }], items: items
    };
    S.jobs = [job].concat(S.jobs);
    S.n++; S.plate = ''; S.km = ''; S.cusName = ''; S.shots = {}; S.sym = {}; S.screen = 'dash'; S.filter = 'all'; S.q = ''; S.lineId = id;
    say('เปิดใบรับรถ ' + job.plate + ' แล้ว · ส่งใบเสนอราคาเข้า LINE ' + job.cus + ' แล้ว');
  }

  function sendRem(r) {
    r.sent = true;
    var slots = ['เสาร์นี้ 10:00 น.', 'พรุ่งนี้ 13:30 น.', 'อาทิตย์นี้ 09:00 น.', 'จันทร์หน้า 15:00 น.'];
    setTimeout(function () {
      r.booked = slots[Math.floor(Math.random() * slots.length)];
      if (S.screen === 'remind') burst();
      say('🎉 ' + r.cus + ' กดจองคิว ' + r.booked);
    }, 1800 + Math.random() * 1200);
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var v = b.getAttribute('data-v'), act = b.getAttribute('data-act'), bj = find(S.billId);
    if (act === 'go') set({ screen: v });
    else if (act === 'filter') set({ filter: v });
    else if (act === 'openLine') set({ screen: 'line', lineId: v });
    else if (act === 'status') {
      var j = find(v), s = b.getAttribute('data-s');
      if (j.status === s) return;
      j.status = s;
      say('ส่ง LINE แจ้ง' + j.cus + ' แล้ว: ' + j.plate + ' "' + ST[s].label + '"');
    } else if (act === 'approve') {
      var k = find(v); k.status = 'repair'; burst();
      say(k.cus + ' กดอนุมัติแล้ว · หน้าอู่เปลี่ยน ' + k.plate + ' เป็น "กำลังซ่อม" ทันที');
    } else if (act === 'fill') set({ plate: v });
    else if (act === 'sym') { S.sym[v] = !S.sym[v]; render(); }
    else if (act === 'submit') submit();
    else if (act === 'hide') set({ hide: !S.hide });
    else if (act === 'call') say('โหมดทดลอง: ของจริงจะโทรหาอู่ทันที');
    else if (act === 'bill') set({ screen: 'bill', billId: v });
    else if (act === 'add' && bj) { var c = CATALOG[+v]; bj.items.push({ name: c[0], type: c[1], price: c[2], cost: c[3] }); say('เพิ่ม ' + c[0] + ' แล้ว'); }
    else if (act === 'rm' && bj) { bj.items.splice(+v, 1); render(); }
    else if (act === 'disc' && bj) { bj.discMode = v; render(); }
    else if (act === 'pay' && bj) { bj.pay = v; render(); }
    else if (act === 'paid' && bj) {
      bj.paid = true; bj.status = 'done';
      S.rems.push({ id: 'r' + bj.id, cus: bj.cus, car: bj.car, plate: bj.plate, last: 'ซ่อมที่อู่ 25 พ.ย. 2569' + (bj.km ? ' · ' + Number(bj.km).toLocaleString('en-US') + ' กม.' : ''), days: 180 });
      burst();
      say('รับเงิน ฿' + money(total(bj) - disc(bj)) + ' แล้ว · ส่งใบเสร็จเข้า LINE · ตั้งเตือนเช็กระยะ 6 เดือนให้แล้ว');
    } else if (act === 'print') window.print();
    else if (act === 'rem') { var r = S.rems.filter(function (x) { return x.id === v; })[0]; sendRem(r); say('ส่ง LINE ชวน' + r.cus + ' กลับมาเช็กรถแล้ว'); }
    else if (act === 'remAll') {
      var list = S.rems.filter(function (x) { return x.days <= 15 && !x.sent; });
      list.forEach(sendRem);
      say('ส่ง LINE เตือนเช็กระยะ ' + list.length + ' คนในคลิกเดียว');
    }
  });
  app.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-shot');
    if (!k || !e.target.files || !e.target.files[0]) return;
    S.shots[k] = URL.createObjectURL(e.target.files[0]);
    render();
  });
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-in');
    if (!k) return;
    var val = e.target.value;
    if (k === 'km') val = val.replace(/[^0-9]/g, '');
    S[k] = val;
    if (k === 'q' || k === 'plate') render();
  });
  render();
})();
</script>
</body>
</html>
