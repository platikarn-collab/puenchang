    var pend = S.jobs.filter(function (j) { return j.status === 'quote'; }).length;
    var due = S.rems.filter(function (r) { return r.days <= 15 && !r.sent; }).length;
    var scr = S.screen === 'bill' ? 'dash' : S.screen;
    function c(k) { return scr === k ? '#1E3A8A' : '#64748B'; }
    return '<nav>' +
      '<button data-act="go" data-v="dash" style="color:' + c('dash') + '"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>หน้าอู่</button>' +
      '<button data-act="go" data-v="in" style="color:' + c('in') + '"><span style="width:44px;height:36px;border-radius:12px;background:#F97316;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>รับรถ</button>' +
      '<button data-act="go" data-v="line" style="color:' + c('line') + '">' + I.chat('currentColor', 27) + 'ลูกค้า LINE' + (pend ? '<span class="badge">' + pend + '</span>' : '') + '</button>' +
      '<button data-act="go" data-v="remind" style="color:' + c('remind') + '">' + I.bell('currentColor', 27) + 'เตือนเช็ก' + (due ? '<span class="badge">' + due + '</span>' : '') + '</button>' +
      '<button data-act="go" data-v="profit" style="color:' + c('profit') + '"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>กำไร</button></nav>';
  }

  var app = document.getElementById('app'), lastScreen = null;
  function render() {
    var a = document.activeElement, fid = a && a.id, pos = a && a.selectionStart;
    var main = app.querySelector('main'), top = main ? main.scrollTop : 0;
    var changed = lastScreen !== S.screen;
    var body = { dash: dash, 'in': checkin, line: line, profit: profit, bill: bill, remind: remind, pick: pick }[S.screen]();
    app.innerHTML = header() + '<main><div class="' + (changed ? 'enter' : '') + '">' + body + '</div></main>' + (S.toast ? '<div class="toast" role="status">' + esc(S.toast) + '</div>' : '') + (S.type ? navbar() : '');
    var m = app.querySelector('main');
    m.scrollTop = changed ? 0 : top;
    lastScreen = S.screen;
    if (fid && !changed) { var el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
  }

  function submit() {
    var found = norm(S.plate) === 'กข1234';
    var picked = PRESETS.filter(function (p) { return S.sym[p[0]]; });
    var items = [];
    picked.forEach(function (p) { items = items.concat(it(p[1])); });
    if (!items.length) items = it([['ค่าตรวจเช็กเบื้องต้น', 'labor', 300, 100]]);
    var shots = SHOTS.filter(function (k) { return S.shots[k]; });
    shots.sort(function (a, b) { return (b === 'จุดที่เสีย') - (a === 'จุดที่เสีย'); });
    var pics = shots.map(function (k) { return { label: k, src: S.shots[k] }; });
    var d = new Date(), id = 'j' + S.n;
    var job = {
      id: id, plate: S.plate.trim(), prov: found ? 'สุรินทร์' : 'ทะเบียนใหม่', car: found ? T().old.car : 'รถลูกค้าใหม่',
      cus: found ? T().old.cus : (S.cusName.trim() || 'ลูกค้าใหม่'),
      sym: picked.length ? picked.map(function (p) { return p[0]; }).join(', ') : 'ตรวจเช็กทั่วไป', status: 'quote',
      time: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2), km: S.km,
      pics: pics.length ? pics : [{ label: 'ยังไม่ได้ถ่ายรูป' }], items: items
    };
    S.jobs = [job].concat(S.jobs);
    S.n++; S.plate = ''; S.km = ''; S.cusName = ''; S.shots = {}; S.sym = {}; S.screen = 'dash'; S.filter = 'all'; S.q = ''; S.lineId = id;
    say('เปิดใบรับรถ ' + job.plate + ' แล้ว · ส่งใบเสนอราคาเข้า LINE ' + job.cus + ' แล้ว');
  }

  function sendRem(r) {
    r.sent = true;
    var slots = ['เสาร์นี้ 10:00 น.', 'พรุ่งนี้ 13:30 น.', 'อาทิตย์นี้ 09:00 น.', 'จันทร์หน้า 15:00 น.'];
    setTimeout(function () {
      r.booked = slots[Math.floor(Math.random() * slots.length)];
      if (S.screen === 'remind') burst();
      say('🎉 ' + r.cus + ' กดจองคิว ' + r.booked);
    }, 1800 + Math.random() * 1200);
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var v = b.getAttribute('data-v'), act = b.getAttribute('data-act'), bj = find(S.billId);
    if (act === 'go') set({ screen: v });
    else if (act === 'type') { setType(v); burst(); say(TYPES[v].icon + ' ปรับเป็น "' + TYPES[v].name + '" แล้ว · ลองกดเล่นได้ทุกปุ่ม'); }
    else if (act === 'stage') { var sj = find(v), si = +b.getAttribute('data-s'); sj.stage = si; say('📸 ส่งรูป + สถานะ "' + T().stages[si] + '" เข้า LINE ' + sj.cus + ' แล้ว'); }
    else if (act === 'filter') set({ filter: v });
    else if (act === 'openLine') set({ screen: 'line', lineId: v });
    else if (act === 'status') {
      var j = find(v), s = b.getAttribute('data-s');
      if (j.status === s) return;
      j.status = s;
      say('ส่ง LINE แจ้ง' + j.cus + ' แล้ว: ' + j.plate + ' "' + ST[s].label + '"');
    } else if (act === 'approve') {
      var k = find(v); k.status = 'repair'; burst();
      say(k.cus + ' กดอนุมัติแล้ว · หน้าอู่เปลี่ยน ' + k.plate + ' เป็น "กำลังซ่อม" ทันที');
    } else if (act === 'fill') set({ plate: v });
    else if (act === 'sym') { S.sym[v] = !S.sym[v]; render(); }
    else if (act === 'submit') submit();
    else if (act === 'hide') set({ hide: !S.hide });
    else if (act === 'call') say('โหมดทดลอง: ของจริงจะโทรหาอู่ทันที');
    else if (act === 'bill') set({ screen: 'bill', billId: v });
    else if (act === 'add' && bj) { var c = CATALOG[+v]; bj.items.push({ name: c[0], type: c[1], price: c[2], cost: c[3] }); say('เพิ่ม ' + c[0] + ' แล้ว'); }
    else if (act === 'rm' && bj) { bj.items.splice(+v, 1); render(); }
    else if (act === 'disc' && bj) { bj.discMode = v; render(); }
    else if (act === 'pay' && bj) { bj.pay = v; render(); }
    else if (act === 'paid' && bj) {
      bj.paid = true; bj.status = 'done';
      S.rems.push({ id: 'r' + bj.id, cus: bj.cus, car: bj.car, plate: bj.plate, last: 'ซ่อมที่อู่ 25 พ.ย. 2569' + (bj.km ? ' · ' + Number(bj.km).toLocaleString('en-US') + ' กม.' : ''), days: T().remDays });
      burst();
      say('รับเงิน ฿' + money(total(bj) - disc(bj)) + ' แล้ว · ส่งใบเสร็จเข้า LINE · ตั้งเตือนเช็กระยะ 6 เดือนให้แล้ว');
    } else if (act === 'print') window.print();
    else if (act === 'rem') { var r = S.rems.filter(function (x) { return x.id === v; })[0]; sendRem(r); say('ส่ง LINE ชวน' + r.cus + ' กลับมาเช็กรถแล้ว'); }
    else if (act === 'remAll') {
      var list = S.rems.filter(function (x) { return x.days <= 15 && !x.sent; });
      list.forEach(sendRem);
      say('ส่ง LINE เตือนเช็กระยะ ' + list.length + ' คนในคลิกเดียว');
    }
  });
  app.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-shot');
    if (!k || !e.target.files || !e.target.files[0]) return;
    S.shots[k] = URL.createObjectURL(e.target.files[0]);
    render();
  });
  app.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-in');
    if (!k) return;
    var val = e.target.value;
    if (k === 'km') val = val.replace(/[^0-9]/g, '');
    S[k] = val;
    if (k === 'q' || k === 'plate') render();
  });
  (function init() {
    var q = (location.search.match(/type=(\w+)/) || [])[1], saved = null;
    try { saved = localStorage.getItem('pc_type'); } catch (e) {}
    var t = TYPES[q] ? q : TYPES[saved] ? saved : null;
    if (t) setType(t);
  })();
  render();
})();
</script>
</body>
</html>
